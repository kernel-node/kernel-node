[[param]]
name = "network"
type = "String"
default = "\"bitcoin\".into()"
doc = "Which Bitcoin network to use."

[[param]]
name = "datadir"
type = "String"
default = "\"~/.kernel-node\".into()"
doc = "Data directory for blockchain and configuration."

[[param]]
name = "connect"
type = "String"
optional = true
doc = "Connect only to this node (format: ip:port or hostname:port)"

[[param]]
name = "daemon"
type = "bool"
default = "false"
doc = "Run the server as a daemon"

[[param]]
name = "sp_keys_file"
type = "String"
optional = true
doc = "Path to a binary silent payments keys file to import at startup."

[[param]]
name = "proxy"
type = "String"
optional = true
doc = "Socks5 proxy for outbound peer connections (format: ip:port)."
